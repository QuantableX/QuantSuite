name: Build QuantSuite

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm run check:modules && npm run check:css && npm run check:isolation && npm run check:commands
      - run: npm run check:ts && npm run check:components
      - run: npm run test:distribution && npm run test:release

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows-x64
            args: --bundles nsis,msi
          - platform: macos-15
            name: macOS-universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: ubuntu-22.04
            name: Linux-x64
            args: --bundles deb,appimage,rpm
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.name }}
          cache-on-failure: true
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev libasound2-dev rpm libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev
      - run: npm ci
      - name: Check Rust
        run: cargo clippy --workspace --all-targets --locked
      - name: Build signed release packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret'; exit 1; }
          npm run tauri:build -- --locked ${{ matrix.args }}
      - name: Build CI packages
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          node -e "require('fs').writeFileSync(process.env.RUNNER_TEMP + '/quantsuite-ci.json', JSON.stringify({bundle:{createUpdaterArtifacts:false}}))"
          npm run tauri:build -- --locked ${{ matrix.args }} --config "$RUNNER_TEMP/quantsuite-ci.json"
      - uses: actions/upload-artifact@v4
        with:
          name: QuantSuite-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/nsis/*.sig
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/msi/*.sig
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app.tar.gz
            target/**/release/bundle/macos/*.sig
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/appimage/*.sig
            target/**/release/bundle/rpm/*.rpm

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: QuantSuite-*
          path: artifacts
      - name: Assemble updater manifest and checksums
        run: node scripts/prepare-release.mjs artifacts release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "QuantSuite $GITHUB_REF_NAME" --generate-notes --latest
