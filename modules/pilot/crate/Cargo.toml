[package]
name = "tauri-plugin-pilot"
links = "tauri-plugin-pilot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "QuantPilot — the suite's agent harness: the local agent TUIs in a terminal, with sessions, the suite as context, and a face that knows what they are doing"

[lib]
name = "qs_mod_pilot"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
dirs = { workspace = true }
# The relay the CLIs report to (Claude Code hooks, statusLine); same stack
# as the mcp module's server.
axum = "0.8"
tokio = { workspace = true }

# Composer context (card 9): `@` file search that honors .gitignore, images
# normalized to PNG, attachments sent as base64.
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"

qs-core = { package = "tauri-plugin-qs", path = "../../../crates/qs-core" }
# The PTYs: one registry with the console, one output channel, one owner rule.
tauri-plugin-console = { path = "../../console/crate" }
# Worktrees: QuantMCP's implementation, never a second one (card 10).
tauri-plugin-mcp = { path = "../../mcp/crate" }

# "Needs you" toasts that open the thread on click — the same WinRT wrapper
# tauri-plugin-notification uses on Windows, without its JS package.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
