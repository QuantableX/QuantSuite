[package]
name = "tauri-plugin-algo"
links = "tauri-plugin-algo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "QuantAlgo — crypto trading bot terminal, as a QuantSuite module"

[lib]
name = "qs_mod_algo"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { workspace = true }

[dependencies]
tauri = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rusqlite = { version = "0.31", features = ["bundled"] }
portable-pty = "0.8"
aes-gcm = "0.10"
ring = "0.17"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zeroize = "1"

# Hyperliquid (PLAN-EXECUTION-VENUES §9): secp256k1 signatures of EIP-712
# hashes over keccak-256. Own signing instead of the official Rust SDK, which
# has had no release since May 2025 and builds on the deprecated ethers-rs.
k256 = { version = "0.14", features = ["ecdsa"] }
sha3 = "0.12"
# Solana addresses and keys (Jupiter, Venues 3/5); ed25519 itself comes from ring.
bs58 = "0.5"

qs-core = { package = "tauri-plugin-qs", path = "../../../crates/qs-core" }
# Manual execution (PLAN-AUTO-EXECUTION §2.3) reads a saved system's config and
# its live signal through QuantSystems' read-only `signals` API.
tauri-plugin-systems = { path = "../../systems/crate" }

# Run notifications: the WinRT wrapper tauri-plugin-notification uses on
# Windows, without its JS package — the same as QuantPilot's toasts.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

# Two migrated bot functions take 8 arguments. Same reasoning as `mcp`.
too_many_arguments = "allow"
