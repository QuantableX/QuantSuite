[package]
name = "tauri-plugin-plan"
links = "tauri-plugin-plan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "QuantPlan — calendar in day, week, month and agenda views, as a QuantSuite module"

[lib]
name = "qs_mod_plan"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

qs-core = { package = "tauri-plugin-qs", path = "../../../crates/qs-core" }

[dev-dependencies]
# The statement-count test hooks `Connection::trace`, which rusqlite gates.
rusqlite = { version = "0.31", features = ["trace"] }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
