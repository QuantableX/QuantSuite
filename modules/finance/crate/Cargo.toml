[package]
name = "tauri-plugin-finance"
links = "tauri-plugin-finance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "QuantFinance — cash-flow Sankey, budget and savings planner, as a QuantSuite module"

[lib]
name = "qs_mod_finance"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

qs-core = { package = "tauri-plugin-qs", path = "../../../crates/qs-core" }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
