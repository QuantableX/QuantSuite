[package]
name = "qs-gateway"
description = "QuantSuite's server gateway (PLAN-SERVER-CLIENT §4, §6.4): device pairing, mutual TLS 1.3, roles, step-up PIN, audit. Tauri-free."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
# TLS 1.3 on ring (the provider the rest of the build already uses), no
# aws-lc: the server's certificate is self-signed and pinned, the client's
# is the device key's.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
ring = "0.17"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
zeroize = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[lints]
workspace = true
